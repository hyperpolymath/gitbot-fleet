# SPDX-License-Identifier: MPL-2.0
[package]
name = "sillybot"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Thin adapter running docudactyl docs-ingest and recon-silly-ation reconcile at pinned commits and reporting docs findings to gitbot-fleet"
repository = "https://github.com/hyperpolymath/gitbot-fleet"
keywords = ["documentation", "audit", "gitbot-fleet"]
categories = ["development-tools"]

[lib]
name = "sillybot"
path = "src/lib.rs"

[[bin]]
name = "sillybot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
toml = "1.1.2"
