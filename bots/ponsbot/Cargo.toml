# SPDX-License-Identifier: MPL-2.0
[package]
name = "ponsbot"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Thin adapter running pons asinorum at a pinned commit and reporting its findings to gitbot-fleet"
repository = "https://github.com/hyperpolymath/gitbot-fleet"
keywords = ["static-analysis", "audit", "gitbot-fleet"]
categories = ["development-tools"]

[lib]
name = "ponsbot"
path = "src/lib.rs"

[[bin]]
name = "ponsbot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
