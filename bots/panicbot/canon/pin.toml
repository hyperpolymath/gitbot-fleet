# panic-attack pin). Value and provenance, not invented: it is the commit the
# standards Hypatia lane runs, `panic-ref`'s default in metadatastician/standards
# `.github/workflows/hypatia-scan-reusable.yml` and `PANIC_ATTACK_SHA` in its
# `fork-governance.yml` (standards main f0b3cd4, 2026-11-12).
#
# NOT YET CONSUMED: the workflows still carry their own copies, and they
# disagree. Alignment is a later phase, decided by the owner:
#   - gitbot-fleet `.github/workflows/fleet-report-back-reusable.yml`:
#     b689a74d2762a1c19839ae3fbd59b7fe5ef920ea (2026-10-08, older; its comment
#     claims it is kept equal to the Hypatia lane's pin, it is not)
#   - standards `.github/workflows/deep-recon-reusable.yml` `panic-rev`:
#     b5530834a839734d1d181bfe6edb0d43d4233cf4 (2026-10-25)
# The rule-ID table above was taken at 5175a681 and is a separate pin.
