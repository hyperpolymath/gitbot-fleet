# SPDX-License-Identifier: MPL-2.0
[package]
name = "idris-dependents"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Read-only estate audit: find external Idris2 projects that depend on hyperpolymath packages"
repository = "https://github.com/hyperpolymath/gitbot-fleet"
keywords = ["idris2", "audit", "dependents", "gitbot-fleet"]
categories = ["development-tools"]

[[bin]]
name = "idris-dependents"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["blocking", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = { version = "1.1.2", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1.7.0"
