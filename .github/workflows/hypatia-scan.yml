# Thin wrapper around hyperpolymath/standards hypatia-scan-reusable.yml.
# See standards#191 for the reusable's purpose and design.

name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  # No `branches:` filter — a required check whose workflow is branch-gated is
  # never created on a non-matching base and blocks merge forever at
  # "Expected — Waiting for status to be reported" (cf. affinescript#645).
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      credential_read_check:
        description: Only validate this repository's saved scanner credential
        type: boolean
        required: false
        default: false

# Estate guardrail: cancel superseded runs so re-pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.credential_read_check && 'credential-check' || 'scan' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scanner-credential:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.credential_read_check }}
    permissions:
      contents: read
    uses: hyperpolymath/hypatia/.github/workflows/credential-read-check.yml@f2c0604880f615bec5edda7aaefc8feac3d04cc5
    with:
      scanner_only: true
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
  hypatia:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.credential_read_check) }}
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    # hypatia-scan-reusable declares one secret; pass that one, not everything.
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
    # Total caller-side wall-clock cap for the reusable. Matches
    # Hypatia's `missing_timeout_minutes` rule expectation. The scan is
    # typically ~3 min; the cap leaves headroom for slow estate builds.

