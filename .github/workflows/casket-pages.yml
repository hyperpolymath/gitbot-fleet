# This workflow is managed by gh actions-lock.
name: GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout casket-ssg
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/casket-ssg
          ref: 4abfd39c78c2eee9de62d658646607877b3ee157 # main 2026-09-03
          path: .casket-ssg
          persist-credentials: false

      - name: Cache Cabal
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            .casket-ssg/dist-newstyle
          key: ${{ runner.os }}-casket-${{ hashFiles('.casket-ssg/casket-ssg.cabal') }}

      - name: Prepare runner Haskell toolchain
        run: |
          set -euo pipefail
          ghc --version
          cabal --version
          cabal update

      - name: Build casket-ssg
        working-directory: .casket-ssg
        run: cabal build

      - name: Prepare site source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .site-src _site

          if [ -d site ]; then
            cp -R site .site-src
          else
            mkdir -p .site-src
            TODAY="$(date +%Y-%m-%d)"
            REPO_NAME="${{ github.event.repository.name }}"
            REPO_URL="https://github.com/${{ github.repository }}"
            README_URL=""

            if [ -f README.md ]; then
              README_URL="${REPO_URL}/blob/${{ github.ref_name }}/README.md"
            elif [ -f README.adoc ]; then
              README_URL="${REPO_URL}/blob/${{ github.ref_name }}/README.adoc"
            fi

            {
              echo "---"
              echo "title: ${REPO_NAME}"
              echo "date: ${TODAY}"
              echo "---"
              echo
              echo "# ${REPO_NAME}"
              echo
              echo "Static documentation site for ${REPO_NAME}."
              echo
              echo "- Source repository: [${{ github.repository }}](${REPO_URL})"
              if [ -n "${README_URL}" ]; then
                echo "- README: [project README](${README_URL})"
              fi
              if [ -d docs ]; then
                echo "- Docs directory: [docs/](${REPO_URL}/tree/${{ github.ref_name }}/docs)"
              fi
              echo
              echo "Project-specific site content can be added later under site/."
            } > .site-src/index.md
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cd .casket-ssg && cabal run casket-ssg -- build ../.site-src ../_site
          touch ../_site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'

  preview:
    name: Validate deployable Pages preview
    if: github.event_name == 'pull_request'
    environment:
      name: pages-preview
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: github-pages
          path: .pages-preview

      - name: Validate deployable artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact=".pages-preview/artifact.tar"
          entries_file="${RUNNER_TEMP}/pages-preview-entries.txt"

          if [ ! -s "${artifact}" ]; then
            echo "::error::Pages artifact is absent or empty"
            exit 1
          fi

          tar -tf "${artifact}" > "${entries_file}"

          entry_count=0
          has_index=0
          while IFS= read -r entry; do
            entry_count=$((entry_count + 1))
            case "${entry}" in
              /*|../*|*/../*|*/..)
                echo "::error::Pages artifact contains an unsafe path: ${entry}"
                exit 1
                ;;
              index.html|*/index.html)
                has_index=1
                ;;
            esac
          done < "${entries_file}"

          if [ "${entry_count}" -eq 0 ]; then
            echo "::error::Pages artifact contains no files"
            exit 1
          fi

          if [ "${has_index}" -ne 1 ]; then
            echo "::error::Pages artifact contains no index.html"
            exit 1
          fi

          {
            echo "### Pages preview artifact"
            echo
            echo "- Files: ${entry_count}"
            echo "- SHA-256: \`$(sha256sum "${artifact}" | awk '{print $1}')\`"
            echo "- Production deployment: intentionally deferred until merge"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy production Pages site
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
