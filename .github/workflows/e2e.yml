name: E2E Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
permissions:
  actions: read
  contents: read
jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install PyYAML (for workflow YAML validation)
        run: pip install pyyaml --quiet
      - name: Verify automation quarantine
        run: bash tests/automation-quarantine-test.sh
      - name: Verify fix-outcome verdicts
        run: bash tests/outcome-verdict-test.sh
      - name: Run E2E tests
        run: bash tests/e2e.sh
      - name: Verify canonical descriptile policy repair
        run: bash tests/retired-descriptile-policy-test.sh
      - name: Verify star-list enrollment discovery
        run: bash tests/enroll-discovery-test.sh
      - name: Verify the fleet report-back driver (envelope contract)
        run: bash tests/fleet-report-back-test.sh
      - name: Fleet enrolment fixer (report-back rollout)
        run: bash tests/fix-fleet-enrolment-test.sh
      - name: Lock closure contracts (dropped edges, malformed refs)
        run: bash scripts/tests/lock-closure-test.sh
      - name: Audit this repository's lock closure
        run: ./scripts/audit-lock-closure.sh
      - name: Prepared secret-scanner migration stays gated
        run: |
          # 0 = every precondition holds, 2 = evidence still missing (expected
          # until the unified-dataset-vocab canary lands). 1 and 3 are findings
          # in the prepared migration and must fail the build.
          rc=0
          ./docs/migrations/secret-scanner-cicd-suite/preflight.sh --quiet || rc=$?
          case "$rc" in
            0|2) echo "preflight exit $rc (no findings)";;
            *) echo "preflight exit $rc: findings in the prepared migration" >&2; exit 1;;
          esac
