name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: metadatastician/standards/.github/workflows/mirror-reusable.yml@b49a33e991f37a2249d873cbdc02c27a08f05d6d
    # mirror-reusable declares exactly these seven forge keys and forbids
    # `secrets: inherit`; pass them by name.
    secrets:
      GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
      BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
      CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
      SOURCEHUT_SSH_KEY: ${{ secrets.SOURCEHUT_SSH_KEY }}
      DISROOT_SSH_KEY: ${{ secrets.DISROOT_SSH_KEY }}
      GITEA_SSH_KEY: ${{ secrets.GITEA_SSH_KEY }}
      RADICLE_KEY: ${{ secrets.RADICLE_KEY }}
    permissions:
      actions: read
      contents: read
      security-events: write
