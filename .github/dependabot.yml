# SPDX-License-Identifier: MPL-2.0
{
  version: 2,
  updates: [
    # No "github-actions" entry, by owner ruling "single pin writer"
    # (2026-11-26). Third-party action pins and .github/workflows/actions.lock
    # are written together, one PR per repository, by the Action pins applier
    # in metadatastician/standards (.github/workflows/action-pins-applier.yml,
    # standards #1688), and first-party standards pins by apply-workflow-pins.
    # The github/codeql-action hold that used to live here is carried in
    # standards config/settings/actions-bump-holds.txt.

    # Rust dependencies. Keep every Cargo project in one update entry so the
    # open-PR limit applies to the fleet as a whole, rather than once per bot.
    # Grouping by dependency name updates a shared crate across every affected
    # project in one PR instead of opening one PR per Cargo.lock.
    #
    # /bots/echidnabot is deliberately absent: it is a pinned sync of
    # hyperpolymath/echidnabot (bots/echidnabot/FLEET-SYNC.json). Its dependencies
    # are bumped upstream and arrive here by a pin bump, never independently;
    # the Vendored bot drift workflow fails on any local edit.
    {
      package-ecosystem: "cargo",
      directories: [
        "/robot-repo-automaton",
        "/shared-context",
        "/bots/glambot",
        "/bots/rhodibot",
        "/bots/seambot",
        "/bots/sustainabot",
        "/bots/finishingbot",
        "/bots/accessibilitybot",
        "/bots/cipherbot",
        "/bots/panicbot",
      ],
      schedule: {
        interval: "weekly",
      },
      open-pull-requests-limit: 3,
      groups: {
        fleet-dependencies: {
          group-by: "dependency-name",
        },
      },
    },
  ],
}
