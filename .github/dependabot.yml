# SPDX-License-Identifier: MPL-2.0
{
  version: 2,
  updates: [
    {
      package-ecosystem: "github-actions",
      directory: "/",
      schedule: {
        interval: "daily",
      },
      groups: {
        actions: {
          patterns: [
            "*",
          ],
        },
      },
      open-pull-requests-limit: 2,
      ignore: [
        # HOLD: github/codeql-action at v4.38.0 (SHA-pinned). v4.38.1 fails
        # GitHub workflow-startup validation estate-wide (nexia-list#100;
        # SHA-form re-bump bypassed versions-scoped ignores - nexia-list#101).
        # Hold until upstream clears 4.38.1 or a new release verifies green.
        {
          dependency-name: "github/codeql-action",
        },
        # ATTESTED reusable workflows: each is a record in
        # scripts/lib/pinned-reusable-sources.json with closure receipts in
        # scripts/lib/lock-closure-receipts.tsv. Dependabot cannot update those,
        # so a bump from it breaks 'Pinned source closure' on main (#686 did).
        # Move these pins only by a deliberate PR that runs
        # scripts/reattest-pinned-source.sh. Name-only entries, as for the
        # CodeQL hold: a SHA re-bump slips past version-scoped ignores.
        # scripts/tests/dependabot-attested-ignore-test.sh keeps this list
        # equal to the manifest's active sources.
        {
          dependency-name: "hyperpolymath/hypatia/.github/workflows/credential-read-check.yml",
        },
        {
          dependency-name: "hyperpolymath/proven-cicd-and-workflows/.github/workflows/secret-scanner-reusable.yml",
        },
        {
          dependency-name: "metadatastician/standards/.github/workflows/governance-reusable.yml",
        },
        {
          dependency-name: "metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml",
        },
        {
          dependency-name: "metadatastician/standards/.github/workflows/mirror-reusable.yml",
        },
        {
          dependency-name: "metadatastician/standards/.github/workflows/scorecard-reusable.yml",
        },
      ],
    },
    # Rust dependencies. Keep every Cargo project in one update entry so the
    # open-PR limit applies to the fleet as a whole, rather than once per bot.
    # Grouping by dependency name updates a shared crate across every affected
    # project in one PR instead of opening one PR per Cargo.lock.
    #
    # /bots/echidnabot is deliberately absent: it is a pinned sync of
    # hyperpolymath/echidnabot (bots/echidnabot/FLEET-SYNC.json). Its dependencies
    # are bumped upstream and arrive here by a pin bump, never independently;
    # the Vendored bot drift workflow fails on any local edit.
    {
      package-ecosystem: "cargo",
      directories: [
        "/robot-repo-automaton",
        "/shared-context",
        "/bots/glambot",
        "/bots/rhodibot",
        "/bots/seambot",
        "/bots/sustainabot",
        "/bots/finishingbot",
        "/bots/accessibilitybot",
        "/bots/cipherbot",
        "/bots/panicbot",
      ],
      schedule: {
        interval: "weekly",
      },
      open-pull-requests-limit: 3,
      groups: {
        fleet-dependencies: {
          group-by: "dependency-name",
        },
      },
    },
  ],
}
