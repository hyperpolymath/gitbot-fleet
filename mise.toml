[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

# Runnable tasks. The root has no Cargo.toml, so run from the crate.
# Prettier is not a mise tool: it needs Node, which is banned by
# LANGUAGE-POLICY, and canonical JSON here must not be reformatted.
[tasks.build]
dir = "robot-repo-automaton"
run = "cargo build --release"

[tasks.test]
dir = "robot-repo-automaton"
run = "cargo test"

[tasks.lint]
dir = "robot-repo-automaton"
run = "cargo fmt --check"

[tasks.fmt]
dir = "robot-repo-automaton"
run = "cargo fmt"
